// Library module build.gradle

plugins {
    id 'com.android.library'
}

android {
    namespace 'com.webvirt'
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Opcional: si quieres reducir tamaño
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// ==================== PARA JITPACK ====================
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                
                groupId = 'com.github.fouzstack'
                artifactId = 'webvirt-engine'
                version = '3.1.1'
            }
        }
    }
}